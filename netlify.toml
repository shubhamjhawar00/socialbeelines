# Netlify build + hosting configuration.
# Environment-specific secrets (analytics ID, reCAPTCHA keys) are set in the
# Netlify UI, never committed here (Req 7.5 / 11.4).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro/sitemap need Node >= 20.19.5.
  NODE_VERSION = "22"

# --- Security headers (all routes) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Long-lived caching for static assets (Req 10.4) ---
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Enable Netlify Identity redirect helper for the CMS admin (optional).
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
